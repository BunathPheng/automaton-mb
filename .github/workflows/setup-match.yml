name: Setup Match Certificates

on:
  workflow_dispatch:

jobs:
  setup-match:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required secrets
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
        run: |
          missing=0
          for name in MATCH_PASSWORD MATCH_GIT_URL MATCH_GIT_BASIC_AUTHORIZATION APPLE_ID TEAM_ID FASTLANE_PASSWORD; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "FASTLANE_PASSWORD = Apple app-specific password from appleid.apple.com"
            echo "MATCH_GIT_BASIC_AUTHORIZATION = base64 of BunathPheng:YOUR_GITHUB_TOKEN"
            exit 1
          fi
          echo "All required secrets are present."

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        run: bundle install

      - name: Generate ad-hoc certificates
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
          CI: true
        run: bundle exec fastlane match adhoc --readonly false
